# Plain-HTTP variant of nginx.conf for deployment BEHIND an external reverse
# proxy (traefik) that terminates TLS and handles the http->https redirect.
# Traefik forwards decrypted traffic to this server on port 80. Mounted at
# /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.

server {
    listen 80;
    server_name _;

    # uploads: 5 files x 25 MB + form overhead
    client_max_body_size 130m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: never buffer, allow long-lived streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
